<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Component Practice</title>
    <link rel="stylesheet" href="style_4.css">
</head>
<body>
    <div class="card">
        <div class="card-image">
            <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png" alt="Pokemon Điện">
            <span class="card-type">Hệ Điện</span>
        </div>
        <div class="card-content">
            <h3 class="card-title">Pokemon</h3>
            <p class="card-description">Pokemon Điện 1000V</p>
            <div class="card-stats">
                <div class="stat"><b>1000V</b><span>Sức mạnh</span></div>
                <div class="stat"><b>120</b><span>Tốc độ</span></div>
                <div class="stat"><b>85</b><span>Phòng thủ</span></div>
            </div>
            <button class="card-btn">Xem thêm</button>
        </div>
    </div>
</body>
</html>
