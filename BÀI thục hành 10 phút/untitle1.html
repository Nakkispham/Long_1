<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thẻ sản phẩm - Product Card</title>
  <link rel="stylesheet" href="style_1.css">
</head>
<body>

  <div class="box">
    <div class="product-card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPMJqMD9rKyysCzcU4lpWrLBGOQ_9uo6iVcBb6NZZ45Q&s=10" alt="Áo thun basic">
      <span class="badge-sale">Sale 30%</span>
      <button class="btn-heart">❤️</button>

      <div class="product-info">
        <h3>Áo thun basic</h3>
        <p class="desc">Áo thun cotton thoáng mát, form regular fit.</p>
        <p class="price">210.000đ <del>300.000đ</del></p>
        <button class="btn-buy">Thêm vào giỏ</button>
      </div>
    </div>
  </div>

</body>
</html>
